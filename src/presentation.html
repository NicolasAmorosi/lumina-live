<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presentación</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif; cursor: none;
    }
    #content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; background: #000; }
    #logo-img { max-width: 90%; max-height: 90%; object-fit: contain; display: none; }
    #display-image { width: 100%; height: 100%; object-fit: contain; display: none; }
    #display-video { width: 100%; height: 100%; object-fit: contain; display: none; }
    #bible-display {
      display: none; width: 100%; height: 100%; padding: 8% 12%;
      flex-direction: column; align-items: center; justify-content: center; text-align: center;
      background: #000;
    }
    #bible-display .verse-text { font-size: 3.5vw; line-height: 1.6; color: #fff; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); font-weight: 300; max-width: 85%; }
    #bible-display .verse-ref { font-size: 2vw; color: #ffffff; margin-top: 5vh; font-weight: 600; }
    #text-display { display: none; width: 100%; height: 100%; padding: 10%; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; font-size: 4vw; background: #000; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="content">
    <img id="logo-img" alt="Logo" />
    <img id="display-image" alt="" />
    <video id="display-video"></video>
    <div id="bible-display">
      <div class="verse-text" id="verse-text"></div>
      <div class="verse-ref" id="verse-ref"></div>
    </div>
    <div id="text-display"></div>
  </div>
  <script>
    const content = document.getElementById('content');
    const logoImg = document.getElementById('logo-img');
    const displayImage = document.getElementById('display-image');
    const displayVideo = document.getElementById('display-video');
    const bibleDisplay = document.getElementById('bible-display');
    const verseText = document.getElementById('verse-text');
    const verseRef = document.getElementById('verse-ref');
    const textDisplay = document.getElementById('text-display');

    function hideAll() {
      logoImg.style.display = 'none';
      displayImage.style.display = 'none';
      displayVideo.style.display = 'none';
      bibleDisplay.style.display = 'none';
      textDisplay.style.display = 'none';
      content.style.background = '#000';
    }

    window.api.onDisplayContent((data) => {
      hideAll();
      content.classList.add('fade-in');
      switch (data.type) {
        case 'black':
          if (!displayVideo.paused) displayVideo.pause();
          break;
        case 'logo':
          if (data.path) { logoImg.src = data.path; logoImg.style.display = 'block'; }
          if (!displayVideo.paused) displayVideo.pause();
          break;
        case 'image':
          displayImage.src = data.url;
          displayImage.style.display = 'block';
          break;
        case 'video':
          if (data.url && data.url !== displayVideo.src) displayVideo.src = data.url;
          displayVideo.style.display = 'block';
          displayVideo.play();
          break;
        case 'video-resume':
          displayVideo.style.display = 'block';
          displayVideo.play();
          break;
        case 'bible':
          verseText.textContent = data.text;
          verseRef.textContent = data.reference;
          bibleDisplay.style.display = 'flex';
          break;
        case 'text':
          textDisplay.textContent = data.text;
          textDisplay.style.display = 'flex';
          break;
      }
    });

    window.api.onVideoCommand((cmd) => {
      switch (cmd.action) {
        case 'play': displayVideo.play(); break;
        case 'pause': displayVideo.pause(); break;
        case 'seek': if (displayVideo.duration) displayVideo.currentTime = cmd.time; break;
      }
    });
  </script>
</body>
</html>
