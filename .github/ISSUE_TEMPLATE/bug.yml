name: Report a bug
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings › About.
      placeholder: 2.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File
      description: If the problem is with a presentation, a video or a Bible, attach it or tell us its format and where it came from.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings › About › Open logs folder. Attach `main.log` (and `crash.log` if there is one).
